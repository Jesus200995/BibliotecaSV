<!DOCTYPE html>
<html>
<head>
    <title>Test Usuarios API</title>
</head>
<body>
    <h1>Test API Usuarios</h1>
    <button onclick="testLogin()">1. Login como admin</button>
    <button onclick="testUsuarios()">2. Obtener usuarios</button>
    <div id="result"></div>

    <script>
        let token = '';
        
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:4000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: 'admin',
                        contrasena: 'admin123' // Cambia por la contraseña correcta
                    })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    token = data.token;
                    document.getElementById('result').innerHTML = `
                        <h3>Login exitoso</h3>
                        <p>Token: ${token.substring(0, 20)}...</p>
                        <p>Usuario: ${data.usuario.usuario}</p>
                        <p>Rol: ${data.usuario.rol}</p>
                    `;
                } else {
                    document.getElementById('result').innerHTML = `<h3>Error de login: ${data.error}</h3>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `<h3>Error: ${error.message}</h3>`;
            }
        }
        
        async function testUsuarios() {
            if (!token) {
                document.getElementById('result').innerHTML = '<h3>Primero debes hacer login</h3>';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:4000/api/usuarios', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                console.log('Usuarios response:', data);
                
                if (data.success) {
                    let html = '<h3>Usuarios encontrados:</h3><ul>';
                    data.usuarios.forEach(usuario => {
                        html += `<li>ID: ${usuario.id}, Usuario: ${usuario.usuario}, Rol: ${usuario.rol}, Activo: ${usuario.activo}</li>`;
                    });
                    html += '</ul>';
                    document.getElementById('result').innerHTML = html;
                } else {
                    document.getElementById('result').innerHTML = `<h3>Error: ${data.error}</h3>`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `<h3>Error: ${error.message}</h3>`;
            }
        }
    </script>
</body>
</html>
